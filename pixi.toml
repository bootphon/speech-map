[workspace]
name = "speech-map"
channels = ["pytorch", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[pypi-dependencies]
speech-map = { path = ".", editable = true }

[environments]
faiss-cpu = ["faiss-cpu"]
faiss-gpu = ["faiss-gpu"]

[feature.faiss-cpu]
dependencies = { faiss-cpu = ">=1.14.1,<2" }
platforms = ["linux-64"]

[feature.faiss-gpu]
dependencies = { faiss-gpu = ">=1.14.1,<2" }
platforms = ["linux-64"]

[dependencies]
python = ">=3.12.13,<3.15"
