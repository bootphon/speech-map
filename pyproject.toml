[project]
name = "speech-map"
version = "0.1.3"
description = "Mean Average Precision over n-grams / words with speech features"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Maxime Poli" },
  { name = "CoML", email = "dev@cognitive-ml.fr" },
]
keywords = ["machine learning", "speech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.4",
  "polars>=1.36.1",
  "torch>=2.6.0",
  "tqdm>=4.67.1",
]

[project.urls]
repository = "https://github.com/bootphon/speech-map"

[project.optional-dependencies]
faiss-cpu = [
  "faiss-cpu>=1.15.1; sys_platform == 'linux'",
]
faiss-gpu = [
  "faiss-gpu>=1.15.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "prek>=0.3.11",
]

[build-system]
requires = ["flit_core>=4.2.0,<5"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
preview = true
select = [
  "correctness",
  "suspicious",
  "complexity",
  "performance",
  "style",
  "security",
  "formatting",
  "pedantic",
  "banned-module-level-imports",
]
ignore = [
  "docstring-missing-exception",
  "docstring-missing-returns",
  "undocumented-public-init",
  "missing-copyright-notice",
  "missing-trailing-comma",
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["faiss"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["F"]  # from torch.nn import functional as F

[tool.typos.default.extend-words]
IY = "IY"

[tool.uv]
conflicts = [[{ extra = "faiss-cpu" }, { extra = "faiss-gpu" }]]
